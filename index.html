<!doctype html>
<html lang="en">
  <head>
    <title>SITE OF Patryk Dreja</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="img/Logo.png" />
    <link rel="stylesheet" href="stylesheet.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div id="menu">
      <div id="button-menu">
        <button id="theme-toggle" aria-label="Przełącz motyw">🌙</button>
        <button onclick="setLanguage('pl')">PL</button>
        <button onclick="setLanguage('en')">EN</button>
      </div>

      <div class="brand">
        <img src="img/Logo.png" alt="Logo" />
        <h1>Patryk Dreja</h1>
      </div>
    </div>
    <div id="nav">
      <nav class="nav-blocks">
        <a
          href="#"
          onclick="loadPage('about')"
          class="nav-block nav-block--pink"
        >
          <i class="fa-solid fa-user"></i>
          <span data-i18n="nav_about">About me</span>
          <small data-i18n="nav_about_desc">Who I am, what I do</small>
        </a>
        <a
          href="#"
          onclick="loadPage('projects')"
          class="nav-block nav-block--teal"
        >
          <i class="fa-solid fa-code"></i>
          <span data-i18n="nav_projects">Projects</span>
          <small data-i18n="nav_projects_desc">Selected projects</small>
        </a>
        <a
          href="#"
          onclick="loadPage('contact')"
          class="nav-block nav-block--amber"
        >
          <i class="fa-solid fa-envelope"></i>
          <span data-i18n="nav_contact">Contact</span>
          <small data-i18n="nav_contact_desc">Email, LinkedIn, GitHub</small>
        </a>
      </nav>
    </div>
    <div id="body"></div>

    <div id="footer">
      <p>&copy; 2026 Patryk Dreja.</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
